name: manually push to dockerhub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release version tag to build and push (e.g., 1.2.3)"
        required: true
        type: string
      target_to_build:
        description: "Bake target (for example base, ltx2-5-distilled-int8, or ltx2-5-distilled-int8-cu128)"
        required: true
        type: string

jobs:
  manual_push:
    runs-on: ${{ fromJSON(github.event.inputs.target_to_build == 'ltx2-5-distilled-int8-bounded' && '["ubuntu-latest"]' || '["blacksmith-8vcpu-ubuntu-2204", "linux"]') }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate bounded image destination
        if: github.event.inputs.target_to_build == 'ltx2-5-distilled-int8-bounded'
        env:
          IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_REPO || secrets.DOCKERHUB_REPO }}
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMG || secrets.DOCKERHUB_IMG }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_NAMESPACE" =~ ^[a-z0-9][a-z0-9_.-]*$ ]] || [[ ! "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9_.-]*$ ]]; then
            echo "::error::The existing DOCKERHUB_REPO and DOCKERHUB_IMG bindings did not resolve from Actions Variables or Secrets to a valid image destination."
            exit 1
          fi

      - name: Clear space to remove unused folders
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: blacksmith docker layer cache
        if: github.event.inputs.target_to_build != 'ltx2-5-distilled-int8-bounded'
        uses: useblacksmith/build-push-action@v2
        with:
          setup-only: true

      - name: Set environment variables
        env:
          IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_REPO || secrets.DOCKERHUB_REPO }}
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMG || secrets.DOCKERHUB_IMG }}
          IMAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          printf 'DOCKERHUB_REPO=%s\n' "$IMAGE_NAMESPACE" >> "$GITHUB_ENV"
          printf 'DOCKERHUB_IMG=%s\n' "$IMAGE_NAME" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION=%s\n' "$IMAGE_VERSION" >> "$GITHUB_ENV"

      - name: Build and push the images to Docker Hub
        uses: docker/bake-action@v7
        with:
          push: true
          targets: ${{ github.event.inputs.target_to_build }}
          set: |
            *.args.DOCKERHUB_REPO=${{ env.DOCKERHUB_REPO }}
            *.args.DOCKERHUB_IMG=${{ env.DOCKERHUB_IMG }}
            *.args.RELEASE_VERSION=${{ env.RELEASE_VERSION }}

      - name: Update description on Docker Hub
        if: github.event.inputs.target_to_build != 'ltx2-5-distilled-int8-bounded'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}/${{ env.DOCKERHUB_IMG }}
